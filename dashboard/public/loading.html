<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUCIX · 正在进行情报扫描</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020408;--text:#e8f4f0;--dim:#6a8a82;--accent:#64f0c8;
  --border:rgba(100,240,200,0.12);--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;align-items:center;justify-content:center}
.logo-ring{width:120px;height:120px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.logo-ring::before{content:'';position:absolute;inset:-8px;border:1px solid var(--border);border-radius:50%;border-top-color:var(--accent);animation:spin 2s linear infinite}
.logo-ring::after{content:'';position:absolute;inset:-16px;border:1px solid rgba(100,240,200,0.06);border-radius:50%;border-bottom-color:rgba(100,240,200,0.15);animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-blink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo-text{font-size:18px;font-weight:700;letter-spacing:0.2em;color:var(--accent)}
.container{display:flex;flex-direction:column;align-items:center;gap:32px;padding:24px}
#bootLines{font-size:12px;color:var(--dim);text-align:left;line-height:2;min-width:min(340px,calc(100vw - 48px))}
#bootLines .line{opacity:0;animation:fadein 0.3s ease forwards}
#bootLines .ok{color:var(--accent)}
#status{font-size:12px;color:var(--accent);letter-spacing:0.15em;margin-top:4px;min-height:20px;display:flex;align-items:center;gap:8px}
#status .blink{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse-blink 1.5s ease-in-out infinite;flex-shrink:0}
#countdown{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:0.1em;text-align:center;min-height:16px}
#countdown .eta{color:var(--text)}
#countdown .bar-wrap{width:min(340px,calc(100vw - 48px));height:2px;background:rgba(100,240,200,0.08);margin-top:8px;overflow:hidden}
#countdown .bar-fill{height:100%;background:var(--accent);width:0%;transition:width 1s linear;box-shadow:0 0 6px var(--accent)}
#details{max-width:min(520px,calc(100vw - 48px));font-size:11px;color:var(--dim);line-height:1.8;text-align:center;min-height:20px}
#details strong{color:var(--accent);font-weight:500}
#details .err{color:#ff8f8f}
</style>
</head>
<body>
<div class="container">
  <div class="logo-ring"><span class="logo-text">CX</span></div>
  <div id="bootLines"></div>
  <div id="status"><span class="blink"></span><span id="statusText">正在采集情报...</span></div>
  <div id="countdown"><span id="etaText"></span><div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div></div>
  <div id="details"></div>
</div>

<script>
const SWEEP_ESTIMATE_S = 50;
const lines = [
  'CRUCIX 情报引擎 v2.0.0',
  '正在启动首次情报扫描...',
  '├─ 连接开源情报 OSINT 数据源',
  '├─ GDELT · OPENSKY · FIRMS · MARITIME · SAFECAST',
  '├─ FRED · BLS · EIA · TREASURY · GSCPI',
  '└─ TELEGRAM · WHO · OFAC · ACLED · REDDIT · BLUESKY',
  '<span class="ok">等待情报扫描完成...</span>',
];
const container = document.getElementById('bootLines');
lines.forEach((text, i) => {
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = text;
    container.appendChild(div);
  }, i * 220);
});

const statusMessages = ['正在采集情报...','正在处理数据源...','正在合成信号...','正在关联信息流...','等待扫描完成...'];
let statusIdx = 0;
const statusText = document.getElementById('statusText');
setInterval(() => {
  statusIdx = (statusIdx + 1) % statusMessages.length;
  statusText.textContent = statusMessages[statusIdx];
}, 4000);

const etaText = document.getElementById('etaText');
const barFill = document.getElementById('barFill');
const details = document.getElementById('details');
let countdownInterval = null;
let healthInterval = null;

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

function renderHealth(h) {
  if (!h || !details) return;
  if (!h.kv?.bound) {
    details.innerHTML = '<span class="err">KV 未绑定：请在 Worker 绑定中把 KV namespace 命名为 <strong>CRUCIX_KV</strong></span>';
    statusText.textContent = '等待 KV 绑定...';
    return;
  }
  if (!h.kv?.ok) {
    details.innerHTML = `<span class="err">KV 读取失败：${escapeHtml(h.kv.error || '未知错误')}</span>`;
    statusText.textContent = 'KV 状态异常...';
    return;
  }
  if (h.status === 'error') {
    details.innerHTML = `<span class="err">最近一次扫描失败：${escapeHtml(h.lastError || h.lastSweep?.error || '请查看 Workers Logs')}</span>`;
    statusText.textContent = '扫描失败，等待自动重试...';
    return;
  }
  if (h.status === 'queued') {
    details.innerHTML = '首次扫描已加入后台任务，正在等待 Worker 执行...';
    return;
  }
  if (h.status === 'running') {
    details.innerHTML = '情报扫描正在运行，完成后会自动进入仪表盘。';
    return;
  }
  if (!h.dataAvailable) {
    details.innerHTML = 'KV 已连接，正在生成第一份 <strong>latest</strong> 仪表盘数据。';
  }
}

function refreshHealth() {
  return fetch('/api/health', { cache: 'no-store' })
    .then(r => r.json())
    .then(h => {
      renderHealth(h);
      return h;
    })
    .catch(() => {
      if (details) details.innerHTML = '<span class="err">暂时无法读取 /api/health，正在重试...</span>';
      return null;
    });
}

function startCountdown(elapsedSeconds) {
  let remaining = Math.max(0, SWEEP_ESTIMATE_S - elapsedSeconds);
  function tick() {
    if (remaining <= 0) {
      etaText.textContent = '正在完成...';
      barFill.style.width = '99%';
      return;
    }
    const pct = Math.min(99, ((SWEEP_ESTIMATE_S - remaining) / SWEEP_ESTIMATE_S) * 100);
    barFill.style.width = pct + '%';
    etaText.innerHTML = `预计 <span class="eta">~${remaining}s</span> 后就绪`;
    remaining--;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

refreshHealth()
  .then(h => {
    const started = h?.sweepStartedAt || h?.lastSweep?.startedAt;
    const elapsed = started ? Math.floor((Date.now() - new Date(started).getTime()) / 1000) : 0;
    startCountdown(elapsed);
  })
  .catch(() => startCountdown(0));
healthInterval = setInterval(refreshHealth, 5000);

let redirected = false;
function goToDashboard() {
  if (redirected) return;
  redirected = true;
  clearInterval(countdownInterval);
  clearInterval(pollInterval);
  clearInterval(healthInterval);
  barFill.style.transition = 'width 0.4s ease';
  barFill.style.width = '100%';
  etaText.textContent = '';
  statusText.textContent = '终端就绪，正在载入仪表盘';
  setTimeout(() => location.replace('/' + location.search), 800);
}

const pollInterval = setInterval(() => {
  fetch('/api/data', { cache: 'no-store' }).then(r => {
    if (r.ok) goToDashboard();
  }).catch(() => {});
}, 5000);
</script>
</body>
</html>
